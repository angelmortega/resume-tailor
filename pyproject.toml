[project]
name = "resume-tailor"
version = "0.1.0"
description = "Tailor LaTeX resumes & cover letters to job postings with Claude, with ATS keyword checks and an application tracker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8",
    "fastapi>=0.141.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
